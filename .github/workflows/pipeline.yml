name: CI/CD pipeline

permissions:
  contents: read          # least privilege by default

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: pip-audit
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install pip-audit
          pip-audit -r app/requirements.txt
  # ─────────────────────────────
  # JOB 1: BUILD & TEST (Docker)
  # ─────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build Docker Compose
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for Nginx to be ready
        run: |
          echo "Waiting for Nginx (port 8080)..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080 > /dev/null 2>&1; then
              echo "Nginx is up after $((i * 2)) seconds."
              exit 0
            fi
            echo "Attempt $i/30 - not ready yet, waiting 2s..."
            sleep 2
          done
          echo "ERROR: Nginx did not become ready in time."
          docker compose logs
          exit 1

      - name: Wait for Flask API to be ready
        run: |
          echo "Waiting for Flask API (/api/health)..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/health > /dev/null 2>&1; then
              echo "Flask API is up after $((i * 2)) seconds."
              exit 0
            fi
            echo "Attempt $i/30 - not ready yet, waiting 2s..."
            sleep 2
          done
          echo "ERROR: Flask API did not become ready in time."
          docker compose logs
          exit 1

      - name: Test encode endpoint
        run: |
          RESULT=$(curl -s -X POST http://localhost:8080/api/encode \
            -H "Content-Type: application/json" \
            -d '{"text": "hello"}')
          echo "Encode result: $RESULT"
          echo $RESULT | grep -q '"success":true' || exit 1

      - name: Test decode endpoint
        run: |
          RESULT=$(curl -s -X POST http://localhost:8080/api/decode \
            -H "Content-Type: application/json" \
            -d '{"text": "aGVsbG8="}')
          echo "Decode result: $RESULT"
          echo $RESULT | grep -q '"success":true' || exit 1

      - name: Test decode returns correct value
        run: |
          RESULT=$(curl -s -X POST http://localhost:8080/api/decode \
            -H "Content-Type: application/json" \
            -d '{"text": "aGVsbG8="}')
          echo $RESULT | grep -q '"result":"hello"' || exit 1

      - name: Test missing field returns error
        run: |
          RESULT=$(curl -s -X POST http://localhost:8080/api/encode \
            -H "Content-Type: application/json" \
            -d '{}')
          echo $RESULT | grep -q '"success":false' || exit 1

      - name: Show logs if failed
        if: failure()
        run: docker compose logs

      - name: Tear down containers
        if: always()
        run: docker compose down

  # ─────────────────────────────
  # JOB 2: CODEQL SECURITY SCAN
  # ─────────────────────────────
  codeql:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        
  publish:
    name: Scan & Publish Image
    runs-on: ubuntu-latest
    needs: [build-and-test, codeql, dependency-audit]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build image (local, for scanning)
        uses: docker/build-push-action@v7
        with:
          context: ./app
          load: true
          tags: scan-target:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: scan-target:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@v7
        with:
          context: ./app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
        
